---
- name: Create .kube directory
  delegate_to: "{{ install_agent_delegate_to }}"
  run_once: true
  ansible.builtin.file:
    path: "{{ install_agent_kubeconfig_dir }}"
    state: directory
    mode: "0711"
  tags:
    - always

- name: Get cert from cluster api address
  delegate_to: "{{ install_agent_delegate_to }}"
  run_once: true
  community.crypto.get_certificate:
    asn1_base64: true
    host: "api.{{ install_agent_cluster_name }}.{{ install_agent_base_domain }}"
    port: 6443
  register: cert
  tags:
    - always

- name: >-
    Set install_agent_cluster_kubeconfig_vault_key to selfsigned-CA
    if CA OU is selfsigned
  delegate_to: "{{ install_agent_delegate_to }}"
  run_once: true
  ansible.builtin.set_fact:
    install_agent_cluster_kubeconfig_vault_key: "kubeconfig"
  when: cert.issuer.O is not defined or cert.issuer.O != install_agent_ca_o
  tags:
    - always

- name: Download kubeconfig from vault
  delegate_to: "{{ install_agent_delegate_to }}"
  run_once: true
  community.hashi_vault.vault_kv2_get:
    url: "{{ vault_address }}"
    engine_mount_point: "{{ install_agent_engine_mount_point }}"
    path: "{{ install_agent_vault_path }}/install"
    auth_method: "{{ install_agent_hashi_vault_auth_method }}"
    role_id: "{{ ansible_hashi_vault_role_id | default('') }}"
    secret_id: "{{ ansible_hashi_vault_secret_id | default('') }}"
    validate_certs: "{{ install_agent_hashi_vault_validate_certs }}"
  register: vault_secret
  tags:
    - always

- name: Write kubeconfig
  delegate_to: "{{ install_agent_delegate_to }}"
  run_once: true
  ansible.builtin.copy:
    content: >-
      {{ vault_secret.data.data[install_agent_cluster_kubeconfig_vault_key] }}
    dest: "{{ install_agent_kubeconfig_dir }}/config"
    mode: '0644'
  tags:
    - always

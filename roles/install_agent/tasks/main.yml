---
- name: Skip agent install (test/stub mode)
  ansible.builtin.meta: end_play
  when: install_agent_skip | bool

- name: Fetch values from Vault or fallback
  run_once: true
  ansible.builtin.set_fact:
    install_agent_additional_trust_bundle: >-
      {{
        lookup('community.hashi_vault.hashi_vault', g_root_ca_lookup)
        if g_root_ca_lookup | length > 0
        else install_agent_additional_trust_bundle
      }}
    install_agent_root_ca: >-
      {{
        lookup('community.hashi_vault.hashi_vault', g_root_ca_lookup)
        if g_root_ca_lookup | length > 0
        else install_agent_root_ca
      }}
    install_agent_pullsecret: >-
      {{
        lookup('community.hashi_vault.hashi_vault', install_agent_pullsecret_lookup)
        if install_agent_pullsecret_lookup | length > 0
        else install_agent_pullsecret
      }}
  no_log: true
  tags:
    - always

- name: Ensure all needed vars are present
  run_once: true
  ansible.builtin.include_tasks: assert.yml
  tags:
    - always

- name: Retrieve current secret from Hashicorp Vault1
  delegate_to: "{{ install_agent_delegate_to }}"
  run_once: true
  community.hashi_vault.vault_kv2_get:
    url: "{{ vault_address }}"
    engine_mount_point: "{{ install_agent_engine_mount_point }}"
    path: "{{ install_agent_vault_path }}/install"
    auth_method: "{{ install_agent_hashi_vault_auth_method }}"
    role_id: "{{ ansible_hashi_vault_role_id | default('') }}"
    secret_id: "{{ ansible_hashi_vault_secret_id | default('') }}"
    validate_certs: "{{ install_agent_hashi_vault_validate_certs }}"
  register: current
  no_log: true

- name: Get information for Bare Metal Server
  ansible.builtin.include_tasks: get_baremetal_infos.yml
  when: install_agent_baremetal | bool

- name: Install OCP
  delegate_to: "{{ install_agent_delegate_to }}"
  run_once: true
  when:
    - current.secret.password is not defined or current.secret.password == ''
  block:
    - name: Prepare OCP install
      ansible.builtin.include_tasks: prepare_ocp4.yml

    - name: Maintain SSH keys
      ansible.builtin.include_tasks: maintain_ssh_keys.yml

    - name: Manage install config
      ansible.builtin.include_tasks: manage_install_config.yml

    - name: Manage agent config
      ansible.builtin.include_tasks: manage_agent_config.yml

    - name: Maintain kube credentials
      ansible.builtin.include_tasks: maintain_kube_creds.yml

    - name: Poweron VMs
      ansible.builtin.include_tasks: power_on_vms.yml
      when:
        - not install_agent_baremetal or install_agent_idrac

    - name: Please attach ISO and Poweron the nodes
      ansible.builtin.pause:
        prompt: "ISO attached and nodes started? (ENTER)"
      register: confirm_apply
      when:
        - install_agent_baremetal

    - name: Wait for install complete agent based
      ansible.builtin.include_tasks: wait_for_install_completed.yml

- name: Post Install
  ansible.builtin.include_tasks: post_ocp.yml
  tags: install_agent_post

- name: Setup Infra and App Nodes
  ansible.builtin.import_tasks: setup_nodes.yml
  tags: install_agent_infra

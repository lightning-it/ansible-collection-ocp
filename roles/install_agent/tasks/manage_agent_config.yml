---
- name: Get macaddress
  module_defaults:
    group/vmware: "{{ vmware_vsphere_module_defaults_vmware_group }}"
    community.vmware.vmware_guest: "{{ vmware_vsphere_module_defaults_vmware_guest }}"
  when: install_agent_vsphere | bool
  block:
    - name: Get macaddress
      delegate_to: "{{ install_agent_delegate_to }}"
      run_once: true
      community.vmware.vmware_guest_info:
        datacenter: "{{ vmware_vsphere_datacenter }}"
        folder: "{{ vmware_vsphere_folder_name }}"
        name: "{{ hostvars[item]['inventory_hostname'] }}"
      with_items: "{{ install_agent_vsphere_group | flatten }}"
      register: vminfo

    - name: Set fact
      run_once: true
      ansible.builtin.set_fact:
        install_agent_create_vms_agent_based_vminfo: "{{ vminfo.results }}"
      when: vminfo is defined

- name: Collect vminfo entries from all hosts
  delegate_to: localhost
  run_once: true
  ansible.builtin.set_fact:
    install_agent_create_vms_agent_based_vminfo: >-
      {{
        (install_agent_create_vms_agent_based_vminfo | default([]))
        + groups['ocp']
        | map('extract', hostvars, 'current_vminfo_entry')
        | select('defined')
        | list
      }}
  when: install_agent_nodes | length == 0

- name: Use explicit install agent nodes
  run_once: true
  ansible.builtin.set_fact:
    install_agent_effective_nodes: "{{ install_agent_nodes }}"
  when: install_agent_nodes | length > 0

- name: Build install agent nodes from VMware facts
  run_once: true
  ansible.builtin.set_fact:
    install_agent_effective_nodes: >-
      {{
        install_agent_effective_nodes
        + [
          {
            'hostname': install_agent_legacy_node.item,
            'role': (
              'master'
              if ('control' in install_agent_legacy_node.item or 'etc' in install_agent_legacy_node.item)
              else 'worker'
            ),
            'interface': install_agent_ifname,
            'mac': install_agent_legacy_node.instance.hw_eth0.macaddress,
            'ip': lookup('ansible.builtin.pipe', 'getent hosts ' ~ install_agent_legacy_node.item).split() | first
          }
        ]
      }}
  loop: "{{ install_agent_create_vms_agent_based_vminfo | default([]) }}"
  loop_control:
    loop_var: install_agent_legacy_node
    label: "{{ install_agent_legacy_node.item | default('install-agent-node') }}"
  when: install_agent_nodes | length == 0

- name: Create agent-config
  block:
    - name: Create agent-config in config dir
      delegate_to: "{{ install_agent_delegate_to }}"
      run_once: true
      ansible.builtin.template:
        src: agent-config.yaml.j2
        dest: "{{ install_agent_cluster_sub_dirs.config }}/agent-config.yaml"
        mode: '0640'

    - name: Retrieve current secret from Hashicorp Vault
      delegate_to: "{{ install_agent_delegate_to }}"
      run_once: true
      community.hashi_vault.vault_kv2_get:
        url: "{{ vault_address }}"
        engine_mount_point: "{{ install_agent_engine_mount_point }}"
        path: "{{ install_agent_vault_path }}/install"
        auth_method: "{{ install_agent_hashi_vault_auth_method }}"
        role_id: "{{ ansible_hashi_vault_role_id | default('') }}"
        secret_id: "{{ ansible_hashi_vault_secret_id | default('') }}"
        validate_certs: "{{ install_agent_hashi_vault_validate_certs }}"
      register: current
      no_log: true

    - name: Write agent-config.yaml to vault
      delegate_to: "{{ install_agent_delegate_to }}"
      run_once: true
      vars:
        values_to_update:
          agent-config.yaml: >-
            {{ lookup('ansible.builtin.template', './agent-config.yaml.j2') }}
      community.hashi_vault.vault_kv2_write:
        url: "{{ vault_address }}"
        engine_mount_point: "{{ install_agent_engine_mount_point }}"
        path: "{{ install_agent_vault_path }}/install"
        auth_method: "{{ install_agent_hashi_vault_auth_method }}"
        role_id: "{{ ansible_hashi_vault_role_id | default('') }}"
        secret_id: "{{ ansible_hashi_vault_secret_id | default('') }}"
        validate_certs: "{{ install_agent_hashi_vault_validate_certs }}"
        data: >-
          {{
            current.secret
            | combine(values_to_update, recursive=False)
          }}
      no_log: true

- name: Create and upload agent based iso image
  module_defaults:
    group/vmware: "{{ vmware_vsphere_module_defaults_vmware_group }}"
    community.vmware.vmware_guest: "{{ vmware_vsphere_module_defaults_vmware_guest }}"

  block:
    - name: Create agent based iso
      delegate_to: "{{ install_agent_delegate_to }}"
      run_once: true
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          export PATH="$HOME/.local/bin:/usr/local/sbin:/usr/local/bin"
          export PATH="$PATH:/usr/sbin:/usr/bin:/sbin:/bin"
          ./openshift-install agent create image \
            --dir {{ install_agent_cluster_sub_dirs.config }}
      args:
        chdir: "{{ install_agent_cluster_sub_dirs.download }}"
        executable: /bin/bash
      register: create_iso
      changed_when: create_iso.rc == 0

    - name: Upload agent iso
      delegate_to: "{{ install_agent_delegate_to }}"
      run_once: true
      community.vmware.vsphere_copy:
        datacenter: "{{ vmware_vsphere_datacenter }}"
        datastore: "{{ vmware_vsphere_vmware_iso_datastore }}"
        path: "{{ vmware_vsphere_iso_path }}"
        src: "{{ install_agent_cluster_sub_dirs.config }}/agent.x86_64.iso"
      when:
        - install_agent_provider == 'vsphere'

    - name: Copy agent ISO to requested path
      delegate_to: "{{ install_agent_delegate_to }}"
      run_once: true
      ansible.builtin.copy:
        src: "{{ install_agent_cluster_sub_dirs.config }}/agent.x86_64.iso"
        dest: "{{ install_agent_agent_iso_path }}"
        mode: '0644'
      when:
        - install_agent_provider != 'vsphere'

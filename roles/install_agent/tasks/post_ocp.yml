---
- name: Get kubeconfig for OCP cluster
  ansible.builtin.include_tasks: cluster_login.yml
  tags:
    - always

- name: Create image tag mirror set
  delegate_to: "{{ install_agent_delegate_to }}"
  run_once: true
  when:
    - install_agent_registry is defined
    - install_agent_registry | bool
  tags:
    - post_install
  block:
    - name: Create image tag mirror set
      kubernetes.core.k8s:
        kubeconfig: "{{ install_agent_kubeconfig_dir }}/config"
        state: present
        definition: >-
          {{ lookup('template', 'imagemirrors.yml.j2') }}
      register: _install_agent_set_imagetagmirrorset_results
      loop:
        - kind: ImageTagMirrorSet
          spec: imageTagMirrors
        - kind: ImageDigestMirrorSet
          spec: imageDigestMirrors

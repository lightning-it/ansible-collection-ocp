---
# general config
ocp_install_agent_skip: false
ocp_install_agent_delegate_to: localhost
ocp_install_agent_dir: /root
ocp_install_agent_platform: vsphere
ocp_install_agent_kubeconfig_dir: '~/.kube'

# vsphere config
ocp_install_agent_vsphere: true
ocp_install_agent_vcenter_hostname:
ocp_install_agent_vcenter_password:
ocp_install_agent_vcenter_username:
ocp_install_agent_vsphere_cluster:
ocp_install_agent_vsphere_datacenter:
ocp_install_agent_vsphere_network:

# ocp config
ocp_install_agent_base_domain: ''
ocp_install_agent_cluster_name:
ocp_install_agent_vault_path: >-
  {{
    cluster_id
    | default('', true)
    | ternary(
      (cluster_id | default(''))[8:11]
      ~ '/'
      ~ (cluster_id | default(''))[11:14]
      ~ '/'
      ~ (cluster_id | default('')),
      ''
    )
  }}
ocp_install_agent_version: 4.18.13
ocp_install_agent_os: linux
ocp_install_agent_arch: x86_64
ocp_install_agent_loadbalancer_usermanaged: false
ocp_install_agent_mirror: >-
  https://mirror.openshift.com/pub/openshift-v4/x86_64/clients/ocp
ocp_install_agent_occlient: >-
  {{
    ocp_install_agent_mirror
    ~ '/'
    ~ ocp_install_agent_version
    ~ '/openshift-client-linux-'
    ~ ocp_install_agent_version
    ~ '.tar.gz'
  }}
ocp_install_agent_download_url: quay.io/openshift-release-dev/ocp-release
ocp_install_agent_machine_network:
ocp_install_agent_service_network: 172.30.0.0/16
ocp_install_agent_pod_network: 10.128.0.0/14
ocp_install_agent_proxy: false
ocp_install_agent_proxy_url:
ocp_install_agent_no_proxy:
ocp_install_agent_pullsecret: ''
ocp_install_agent_registry_quayio:
ocp_install_agent_ssh_pub_keys: []
ocp_install_agent_registry: false
ocp_install_agent_root_ca:
ocp_install_agent_ca_o:
ocp_install_agent_additional_trust_bundle: ''
ocp_install_agent_api_vip: >-
  {{
    lookup(
      'community.general.dig',
      'api.'
      ~ ocp_install_agent_cluster_name
      ~ '.'
      ~ ocp_install_agent_base_domain
    )
    if (
      ocp_install_agent_cluster_name | default('', true) | length > 0
      and ocp_install_agent_base_domain | default('', true) | length > 0
    )
    else ''
  }}
ocp_install_agent_apps_vip: >-
  {{
    lookup(
      'community.general.dig',
      'wildcard.apps.'
      ~ ocp_install_agent_cluster_name
      ~ '.'
      ~ ocp_install_agent_base_domain
    )
    if (
      ocp_install_agent_cluster_name | default('', true) | length > 0
      and ocp_install_agent_base_domain | default('', true) | length > 0
    )
    else ''
  }}
ocp_install_agent_ifname: ens192
ocp_install_agent_gateway:
ocp_install_agent_dns_servers:
ocp_install_agent_netmask_prefix: >-
  {{
    (
      ocp_install_agent_machine_network
      | ansible.utils.ipaddr('prefix')
    )
    if ocp_install_agent_machine_network | default('', true) | length > 0
    else ''
  }}
ocp_install_agent_image_tag_mirrors: {}
ocp_install_agent_taints_ocs:
  - effect: NoSchedule
    key: node.ocs.openshift.io/storage
    value: "true"
ocp_install_agent_odf: true

# hashicorp config
ocp_install_agent_engine_mount_point: infra-secrets
ocp_install_agent_hashi_vault_auth_method: approle
ocp_install_agent_cluster_kubeconfig_vault_key: kubeconfig_CA
ocp_install_agent_hashi_vault_validate_certs: true

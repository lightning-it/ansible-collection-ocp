---
gitops_bootstrap_skip: false
gitops_bootstrap_operator_state: present
gitops_bootstrap_argocd_state: present
gitops_bootstrap_approve: false
gitops_bootstrap_operator_name: openshift-gitops-operator
gitops_bootstrap_operator_channel: gitops-1.18
gitops_bootstrap_operator_source: redhat-operators
gitops_bootstrap_operator_install_plan: Manual
gitops_bootstrap_operator_starting_csv: ''
gitops_bootstrap_operator_subscription_extras: |
  config:
    env:
    - name: ARGOCD_CLUSTER_CONFIG_NAMESPACES
      value: openshift-gitops
gitops_bootstrap_value_files:
  - "{{ 'cluster/%s/values.yaml' | format(cluster_id[8:11]) }}"
  - >-
    {{
      'cluster/%s/%s/values.yaml'
      | format(cluster_id[8:11], cluster_id[11:14])
    }}
  - >-
    {{
      'cluster/%s/%s/%s/values.yaml'
      | format(cluster_id[8:11], cluster_id[11:14], cluster_id)
    }}
gitops_bootstrap_app_instance_label_key: app.kubernetes.io/instance
gitops_bootstrap_vault_enabled: false
gitops_bootstrap_external_secrets_path: >-
  {{
    'stage-2c/data/%s/%s/%s/approle'
    | format(cluster_id[1:4], cluster_id[4:7], cluster_id)
  }}
gitops_bootstrap_hashi_vault_auth_method: approle
gitops_bootstrap_hashi_vault_validate_certs: true

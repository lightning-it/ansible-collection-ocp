---
- name: Normalize gitops_bootstrap variables (backward compatibility)
  run_once: true
  ansible.builtin.set_fact:
    gitops_bootstrap_skip: >-
      {{ gitops_bootstrap_skip | default(vars.get('gitops_skip'), true) }}
    gitops_bootstrap_operator_state: >-
      {{
        gitops_bootstrap_operator_state
        | default(vars.get('gitops_operator_state'), true)
      }}
    gitops_bootstrap_argocd_state: >-
      {{
        gitops_bootstrap_argocd_state
        | default(vars.get('gitops_argocd_state'), true)
      }}
    gitops_bootstrap_approve: >-
      {{
        gitops_bootstrap_approve
        | default(vars.get('gitops_approve'), true)
      }}
    gitops_bootstrap_operator_name: >-
      {{
        gitops_bootstrap_operator_name
        | default(vars.get('gitops_operator_name'), true)
      }}
    gitops_bootstrap_operator_channel: >-
      {{
        gitops_bootstrap_operator_channel
        | default(vars.get('gitops_operator_channel'), true)
      }}
    gitops_bootstrap_operator_source: >-
      {{
        gitops_bootstrap_operator_source
        | default(vars.get('gitops_operator_source'), true)
      }}
    gitops_bootstrap_operator_install_plan: >-
      {{
        gitops_bootstrap_operator_install_plan
        | default(vars.get('gitops_operator_install_plan'), true)
      }}
    gitops_bootstrap_operator_starting_csv: >-
      {{
        gitops_bootstrap_operator_starting_csv
        | default(vars.get('gitops_operator_starting_csv'), true)
      }}
    gitops_bootstrap_operator_subscription_extras: >-
      {{
        gitops_bootstrap_operator_subscription_extras
        | default(vars.get('gitops_operator_subscription_extras'), true)
      }}
    gitops_bootstrap_repo_templates: >-
      {{
        gitops_bootstrap_repo_templates
        | default(vars.get('gitops_repo_templates'), true)
        | default({}, true)
      }}
    gitops_bootstrap_value_files: >-
      {{
        gitops_bootstrap_value_files
        | default(vars.get('gitops_value_files'), true)
        | default([], true)
      }}
    gitops_bootstrap_app_instance_label_key: >-
      {{
        gitops_bootstrap_app_instance_label_key
        | default(vars.get('gitops_app_instance_label_key'), true)
      }}
    gitops_bootstrap_vault_enabled: >-
      {{
        gitops_bootstrap_vault_enabled
        | default(vars.get('gitops_vault_enabled'), true)
      }}
    gitops_bootstrap_external_secrets_path: >-
      {{
        gitops_bootstrap_external_secrets_path
        | default(vars.get('gitops_external_secrets_path'), true)
      }}
    gitops_bootstrap_hashi_vault_auth_method: >-
      {{
        gitops_bootstrap_hashi_vault_auth_method
        | default(vars.get('gitops_hashi_vault_auth_method'), true)
      }}
    gitops_bootstrap_hashi_vault_validate_certs: >-
      {{
        gitops_bootstrap_hashi_vault_validate_certs
        | default(vars.get('gitops_hashi_vault_validate_certs'), true)
      }}
    gitops_bootstrap_git_repo_url: >-
      {{
        gitops_bootstrap_git_repo_url
        | default(vars.get('gitops_git_repo_url'), true)
        | default('', true)
      }}
    gitops_bootstrap_target_revision: >-
      {{
        gitops_bootstrap_target_revision
        | default(vars.get('gitops_target_revision'), true)
        | default('HEAD', true)
      }}

- name: Skip gitops bootstrap role (test/stub mode)
  ansible.builtin.meta: end_play
  when: gitops_bootstrap_skip | bool

- name: Manage gitops operator
  run_once: true
  vars:
    manage_operator_name: "{{ gitops_bootstrap_operator_name }}"
    manage_operator_namespace: openshift-gitops-operator
    manage_operator_channel: "{{ gitops_bootstrap_operator_channel }}"
    manage_operator_source: "{{ gitops_bootstrap_operator_source }}"
    manage_operator_source_namespace: openshift-marketplace
    manage_operator_deployment_name: >-
      openshift-gitops-operator-controller-manager
    manage_operator_create_namespace: true
    manage_operator_starting_csv: >-
      {{ gitops_bootstrap_operator_starting_csv }}
    manage_operator_approve: >-
      {{ gitops_bootstrap_approve }}
    manage_operator_subscription_extras: >-
      {{ gitops_bootstrap_operator_subscription_extras }}
  ansible.builtin.include_role:
    name: lit.ocp.manage_operator

- name: >-
    Add cluster-admin role to serviceaccount
    openshift-gitops-argocd-application-controller
  delegate_to: localhost
  run_once: true
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: >-
          cluster-admin-openshift-gitops-argocd-application-controller
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: cluster-admin
      subjects:
        - kind: ServiceAccount
          name: openshift-gitops-argocd-application-controller
          namespace: openshift-gitops

- name: Fetch repo passwords from Vault lookup strings
  delegate_to: localhost
  run_once: true
  ansible.builtin.set_fact:
    gitops_bootstrap_repo_templates: >-
      {{
        gitops_bootstrap_repo_templates | combine({
          item.key: item.value | combine({
            'password': lookup(
              'community.hashi_vault.hashi_vault',
              item.value.vault_lookup
            )
          })
        })
      }}
  loop: "{{ gitops_bootstrap_repo_templates | dict2items }}"
  when:
    - gitops_bootstrap_vault_enabled | bool
    - item.value.vault_lookup is defined
    - item.value.vault_lookup | trim | length > 0
    - >-
      item.value.vault_secret is not defined
      or item.value.vault_secret | trim | length == 0
    - item.value.password | default('', true) | trim | length == 0
  no_log: true

- name: Fetch repo passwords from Vault secret paths
  delegate_to: localhost
  run_once: true
  ansible.builtin.set_fact:
    gitops_bootstrap_repo_templates: >-
      {{
        gitops_bootstrap_repo_templates | combine({
          item.key: item.value | combine({
            'password': lookup(
              'community.hashi_vault.hashi_vault',
              'secret=' ~ (
                item.value.vault_secret
                if ':' in item.value.vault_secret
                else item.value.vault_secret ~ ':password'
              ),
              url=g_vault_addr,
              auth_method=gitops_bootstrap_hashi_vault_auth_method,
              validate_certs=gitops_bootstrap_hashi_vault_validate_certs,
              role_id=g_vault_approle | default(''),
              secret_id=g_vault_secretid | default('')
            )
          })
        })
      }}
  loop: "{{ gitops_bootstrap_repo_templates | dict2items }}"
  when:
    - gitops_bootstrap_vault_enabled | bool
    - item.value.vault_secret | default('', true) | trim | length > 0
    - item.value.password | default('', true) | trim | length == 0
  no_log: true

- name: Validate gitops_bootstrap_tls_certs entries
  delegate_to: localhost
  run_once: true
  ansible.builtin.assert:
    that:
      - item.url is defined
      - item.url | default('', true) | trim | length > 0
      - item.cert is defined
      - item.cert | default('', true) | trim | length > 0
    fail_msg: >-
      Each gitops_bootstrap_tls_certs entry must include non-empty 'url' and 'cert' keys.
  loop: "{{ gitops_bootstrap_tls_certs }}"
  when:
    - gitops_bootstrap_tls_certs is defined
    - gitops_bootstrap_tls_certs | length > 0

- name: Create tls config
  delegate_to: localhost
  run_once: true
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'argocd-tls-certs-cm.yml.j2') | from_yaml_all }}"
  when:
    - gitops_bootstrap_tls_certs is defined
    - gitops_bootstrap_tls_certs | length > 0
- name: Create repo secret templates for first deployment
  delegate_to: localhost
  run_once: true
  kubernetes.core.k8s:
    definition: >-
      {{
        lookup(
          'template',
          'secrets-repo-credentials-template.yml.j2'
        ) | from_yaml_all
      }}
  with_dict: "{{ gitops_bootstrap_repo_templates }}"
  no_log: true

- name: Calculate gitops bootstrap value files
  run_once: true
  ansible.builtin.set_fact:
    computed_value_files:
      - "cluster/{{ cluster_id[8:11] }}/values.yaml"
      - "cluster/{{ cluster_id[8:11] }}/{{ cluster_id[11:14] }}/values.yaml"
      - "cluster/{{ cluster_id[8:11] }}/{{ cluster_id[11:14] }}/{{ cluster_id }}/values.yaml"

- name: Create argocd app of apps
  delegate_to: localhost
  run_once: true
  vars:
    gitops_bootstrap_value_files: "{{ computed_value_files }}"
  kubernetes.core.k8s:
    definition: >-
      {{
        lookup(
          'template',
          'application-00-app-of-apps.yml.j2'
        ) | from_yaml_all
      }}
    state: present
  when: gitops_bootstrap_operator_state != 'absent'

- name: Set argocd to defined state
  delegate_to: localhost
  run_once: true
  kubernetes.core.k8s:
    definition: >-
      {{
        lookup(
          'template',
          'argocd-openshift-gitops.yml.j2'
        ) | from_yaml_all
      }}
    state: "{{ gitops_bootstrap_operator_state }}"
    wait: true
    wait_timeout: 120
  when: gitops_bootstrap_operator_state != 'absent'

- name: Init vault lookup strings
  run_once: true
  ansible.builtin.set_fact:
    gitops_bootstrap_ext_role_id_lookup: |
      secret={{ gitops_bootstrap_external_secrets_path }}:role_id
      url={{ g_vault_addr }}
      auth_method={{ gitops_bootstrap_hashi_vault_auth_method }}
      validate_certs={{ gitops_bootstrap_hashi_vault_validate_certs | string }}
      role_id={{ g_vault_approle | default('') }}
      secret_id={{ g_vault_secretid | default('') }}
    gitops_bootstrap_ext_secret_id_lookup: |
      secret={{ gitops_bootstrap_external_secrets_path }}:secret_id
      url={{ g_vault_addr }}
      auth_method={{ gitops_bootstrap_hashi_vault_auth_method }}
      validate_certs={{ gitops_bootstrap_hashi_vault_validate_certs | string }}
      role_id={{ g_vault_approle | default('') }}
      secret_id={{ g_vault_secretid | default('') }}
  when: gitops_bootstrap_vault_enabled | bool

- name: Get approle secrets from vault
  run_once: true
  ansible.builtin.set_fact:
    gitops_bootstrap_ext_secrets_role_id: >-
      {{
        lookup(
          'community.hashi_vault.hashi_vault',
          gitops_bootstrap_ext_role_id_lookup
        )
      }}
    gitops_bootstrap_ext_secrets_secret_id: >-
      {{
        lookup(
          'community.hashi_vault.hashi_vault',
          gitops_bootstrap_ext_secret_id_lookup
        )
      }}
  ignore_errors: true
  register: get_secrets
  when: gitops_bootstrap_vault_enabled | bool

- name: Create approle secret for external secrets
  delegate_to: localhost
  run_once: true
  kubernetes.core.k8s:
    definition: >-
      {{
        lookup(
          'template',
          'external-secrets-approle-secret.yml.j2'
        ) | from_yaml_all
      }}
  when:
    - gitops_bootstrap_ext_secrets_role_id is defined
      and gitops_bootstrap_ext_secrets_role_id | length > 0
    - gitops_bootstrap_ext_secrets_secret_id is defined
      and gitops_bootstrap_ext_secrets_secret_id | length > 0
    - gitops_bootstrap_vault_enabled

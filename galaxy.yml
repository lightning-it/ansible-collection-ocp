---
namespace: lit
name: ocp
version: 1.3.1
readme: README.md
description: Opinionated Ansible collection for Red Hat OpenShift Container Platform
  in the ModuLix ecosystem. Provides roles for cluster bring-up, day-2 operations
  and platform services on top of OpenShift.
repository: https://github.com/lightning-it/ansible-collection-ocp
authors:
  - Lightning IT
license:
  - GPL-3.0-only
tags:
  - modulix
  - ocp
  - openshift
  - kubernetes
  - automation
  - devops
  - infrastructure
dependencies:
  ansible.posix: '*'
  ansible.utils: '*'
  community.general: '*'
  kubernetes.core: '*'
  community.hashi_vault: '*'
  community.crypto: '*'
  community.vmware: '*'
build_ignore:
  - node_modules
  - vagrant
  - .git
  - .github
  - .gitignore
  - .molecule
  - ansible_collections
  - infra
  - '*.terraform*'
  - '*.tar.gz'
